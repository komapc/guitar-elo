name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/model.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for the sitemap's lastmod
      - uses: actions/configure-pages@v5
      # Pages caches every file for 10 minutes; a commit stamp keeps a fresh page from pairing with an old app.js.
      - name: Stamp asset URLs with the commit
        run: |
          pages=$(find site -name index.html)
          sed -i "s/?v=dev\"/?v=${GITHUB_SHA::8}\"/g" $pages
          if grep -n "?v=dev" $pages; then exit 1; fi
          for f in $pages; do test "$(grep -o "?v=${GITHUB_SHA::8}\"" "$f" | wc -l)" -eq 4 || { echo "$f: not 4 stamps"; exit 1; }; done
      # lastmod = the day the site itself last changed, so README or test edits do not move it.
      - name: Stamp sitemap lastmod
        run: |
          d=$(git log -1 --format=%cs -- site)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$d</lastmod>|g" site/sitemap.xml
          n=$(grep -c "<loc>" site/sitemap.xml)
          test "$(grep -c "<lastmod>$d</lastmod>" site/sitemap.xml)" -eq "$n"
          test "$n" -eq "$(find site -name index.html | wc -l)" || { echo "sitemap has $n pages"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell the IndexNow engines (Bing, Yandex) about every sitemap page, but only when site/ changed:
      # a push that touches only README or tests submits nothing. A failed ping does not fail the deploy.
      - name: Submit the pages to IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- site; then
            echo "site/ unchanged since $BEFORE, nothing to submit"; exit 0
          fi
          host=$(cat site/CNAME)
          key=$(find site -maxdepth 1 -regextype egrep -regex 'site/[0-9a-f]{32}\.txt' -printf '%f' | cut -c1-32)
          urls=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          jq -nc --arg h "$host" --arg k "$key" --argjson u "$urls" \
            '{host: $h, key: $k, keyLocation: "https://\($h)/\($k).txt", urlList: $u}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json; charset=utf-8' \
                --data-binary @- -w 'IndexNow: HTTP %{http_code}\n' https://api.indexnow.org/indexnow
