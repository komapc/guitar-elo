name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/model.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for the sitemap's lastmod
      - uses: actions/configure-pages@v5
      # Pages caches every file for 10 minutes; a commit stamp keeps a fresh page from pairing with an old app.js.
      - name: Stamp asset URLs with the commit
        run: |
          sed -i "s/?v=dev\"/?v=${GITHUB_SHA::8}\"/g" site/index.html site/ru/index.html
          test "$(cat site/index.html site/ru/index.html | grep -o "?v=${GITHUB_SHA::8}\"" | wc -l)" -eq 6
      # lastmod = the day the site itself last changed, so README or test edits do not move it.
      - name: Stamp sitemap lastmod
        run: |
          d=$(git log -1 --format=%cs -- site)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$d</lastmod>|g" site/sitemap.xml
          test "$(grep -c "<lastmod>$d</lastmod>" site/sitemap.xml)" -eq 2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
